# @package _global_
# Tab. III "Ours + Proprio", Humanoid. HF stage1/9gxajylc,
# 0.1605 / 3.20 AVE (m/s) / ATE (m) on HumanoidOdom_Joints_Test.
#   python train_ssio.py +experiment=humanoid/ssio_proprio
defaults:
  - override /dataset@train_dataset: HumanoidOdom_Joints_Train
  - override /dataset@eval_dataset : HumanoidOdom_Joints_Valid
  - override /network: airio_joints_imu_only_humanoid
  - override /loss   : ssio_dv_1_3_9_27

modality:
  use_aux_imu: true
  use_joints : true

train:
  lr         : 1.0e-3
  decay      : 1.0e-3
  batch      : 512
  epoch      : 50
  regularization_gate  : imu
  regularization_weight: 1.0
