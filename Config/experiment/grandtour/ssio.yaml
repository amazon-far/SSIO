# @package _global_
# Tab. II "Ours", GrandTour. HF stage1/3dqmg13r,
# 0.0958 / 4.37 AVE (m/s) / ATE (m) on ANYmal_Test. Longest Δv horizon 3.65 s (Tab. VI).
#   python train_ssio.py +experiment=grandtour/ssio
defaults:
  - override /dataset@train_dataset: ANYmal_SSL
  - override /dataset@eval_dataset : ANYmal_Val
  - override /network: airio_imu_only
  - override /loss   : ssio_dv_1_3_9_27_81

modality:
  use_aux_imu: false
  use_joints : false

train:
  lr         : 5.0e-5
  decay      : 1.0e-5
  batch      : 256
  epoch      : 120
  regularization_gate  : imu
  regularization_weight: 1.0
