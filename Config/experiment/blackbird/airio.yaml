# @package _global_
# Tab. II "AirIO†" (supervised), Blackbird. HF supervised/dvilntqz,
# 0.3621 / 6.39 AVE (m/s) / ATE (m) on BlackBird_Test. For the "AirIO" row add network=airio
# (HF supervised/4ktbuoar).
#   python train_ssio.py +experiment=blackbird/airio
defaults:
  - override /dataset@train_dataset: BlackBird_Train_Randomized
