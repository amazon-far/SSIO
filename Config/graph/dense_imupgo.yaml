_target_: Optimizer.direct_pgo.Dense_IMUPGOGraph

# Same factor graph as sparse_imupgo, solved densely with Cholesky: O(N^3) in the
# number of keyframes, so only for short trajectories (e.g. the CPU quick start).
anchor_weight: 1.0e6      # rotation anchor prior at anchor 0
vel_prior_weight: 1.0e6   # GT body velocity at anchor 0, seeded and pinned
max_iter     : 10         # Gauss-Newton iterations
tol          : 1.0e-5     # ||dx||_inf convergence threshold

# chi-square(3) gate on velocity observations; null = off.
obs_reject_chi2: null
obs_reject_all: false     # true: drop every observation above the gate per pass; false: at most one
