# TLIO_Train_BiasInject.yaml -- one Bias(RandomWindow(TLIO_Sequence(...))) per train sequence.
# Same train split / inner config as TLIO_Train_Randomized.yaml, with an extra
# constant-bias augmentation layer wrapped *on top of* the RandomWindow.
# Bias is added to the raw acc / gyro streams only (same units as the channels:
# m/s^2 for acc, rad/s for gyro). Everything except seq.config.seq_name is shared
# via YAML anchors.
#
# The knobs below are bias *magnitudes*: Sequence.Bias draws one random direction
# per sequence instance and scales it to that norm, so the offset is constant
# along a sequence. They are hoisted to the top level so they can be overridden
# directly from the Hydra CLI. This file is composed at the
# `train_dataset` mount point (`dataset@train_dataset` in Config/train_*.yaml),
# so override them as:
#
#   python train_ssio.py dataset@train_dataset=TLIO_Train_BiasInject \
#       train_dataset.acc_bias=0.1 train_dataset.gyro_bias=0.01
#
# Both default to 0 (no-op augmentation); set them on the CLI to inject bias.

acc_bias : 0.0   # accelerometer bias magnitude [m/s^2]; override on the CLI
gyro_bias: 0.0   # gyroscope     bias magnitude [rad/s]; override on the CLI

_noise: &noise
  _target_: Sequence.Bias.Bias
  config:
    acc_bias  : ${train_dataset.acc_bias}
    gyro_bias : ${train_dataset.gyro_bias}

_window: &window
  _target_: Sequence.RandomWindow.RandomWindow
  config:
    window_size : ${train.window}

_inner: &inner
  _target_: Sequence.TLIO.TLIO_Sequence

_inner_config: &inner_config
  data_root  : ${host_env:DATA_ROOT}/TLIO
  device     : ${meta.device}
  dtype      : ${meta.dtype}
  acc_sigma  : 0.01
  gyro_sigma : 0.01


