# BlackBird_Train_Randomized.yaml — RandomWindow(BlackBird_Sequence) per trajectory.
# seq_name values are relative to data_root.
# acc_sigma / gyro_sigma = sqrt(acc_cov), sqrt(gyro_cov).

_outer: &outer
  _target_: Sequence.RandomWindow.RandomWindow
  config:
    window_size :  ${train.window}

_inner: &inner
  _target_: Sequence.BlackBird.BlackBird_Sequence

_inner_config: &inner_config
  data_root: ${host_env:DATA_ROOT}/BlackBird
  device: ${meta.device}
  dtype: ${meta.dtype}
  acc_sigma  : 0.01
  gyro_sigma : 0.01
  gravity: 9.81007
  debias     : true   # subtract constant acc/gyro bias over near-static runs; see Sequence/BlackBird.py. Frame alignment happens regardless of this flag.
  calibrater :        # static frames from IMU statistics, no GT speed (Doc/debias.md)
    kind     : imu

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "sid/yawForward/maxSpeed4p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "bentDice/yawForward/maxSpeed0p5"}}}
