# HumanoidOdom_Valid.yaml — non-overlapping SlidingWindow over the 31 HumanoidOdom_Train
# clips. Model selection is in-sample, as in the Hugging Face checkpoints; the held-out
# clip is HumanoidOdom_Test. Non-overlapping stride keeps trainer eval plots correct
# (they concatenate windows into one trajectory).
#
# Pelvis IMU, native z-up, gravity +9.81007.

_outer: &outer
  _target_: Sequence.SlidingWindow.SlidingWindow
  config:
    window_size : ${train.window}
    step_size   : ${train.window}

_inner: &inner
  _target_: Sequence.HumanoidOdom.HumanoidOdom

_inner_config: &inner_config
  data_root  : ${host_env:DATA_ROOT}/humanoid_g1
  device     : ${meta.device}
  dtype      : ${meta.dtype}
  part       : pelvis
  debias     : true
  calibrater :          # static frames from IMU statistics, no GT speed (Doc/debias.md)
    kind     : imu
  acc_sigma  : 0.01
  gyro_sigma : 0.01
  gravity    : ${train.gravity}

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "10708_navigation_20260527_193508"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "10708_navigation_20260527_193939"}}}
