# BlackBird_Test.yaml — SlidingWindow test split (non-overlapping windows).

_outer: &outer
  _target_: Sequence.SlidingWindow.SlidingWindow
  config:
    window_size :  ${train.window}
    step_size   :  ${train.window}

_inner: &inner
  _target_: Sequence.BlackBird.BlackBird_Sequence

_inner_config: &inner_config
  data_root: ${host_env:DATA_ROOT}/BlackBird
  device: ${meta.device}
  dtype: ${meta.dtype}
  acc_sigma  : 0.01
  gyro_sigma : 0.01
  gravity: 9.81007
  debias     : true   # subtract constant acc/gyro bias over near-static runs; see Sequence/BlackBird.py. Frame alignment happens regardless of this flag.
  calibrater :        # static frames from IMU statistics, no GT speed (Doc/debias.md)
    kind     : imu

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "picasso/yawConstant/maxSpeed6p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "picasso/yawConstant/maxSpeed2p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "egg/yawForward/maxSpeed3p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "clover/yawForward/maxSpeed5p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "mouse/yawForward/maxSpeed6p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "mouse/yawForward/maxSpeed7p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "bentDice/yawForward/maxSpeed1p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "picasso/yawConstant/maxSpeed3p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "bentDice/yawForward/maxSpeed3p0"}}}
