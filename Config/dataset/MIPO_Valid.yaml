# MIPO_Valid.yaml
# 12 sequences (1 with frozen IMU data commented out), 5 IMUs, 16 joints
# Disjoint from MIPO_Train.yaml and MIPO_Test.yaml.

_outer: &outer
  _target_: Sequence.SlidingWindow.SlidingWindow
  config:
    window_size : ${train.window}
    step_size   : ${train.window}

_inner: &inner
  _target_: Sequence.MIPO.MIPO_Sequence

_inner_config: &inner_config
  data_root        : ${host_env:DATA_ROOT}/mipo_hdf5/indoor
  device           : ${meta.device}
  dtype            : ${meta.dtype}
  acc_sigma        : 0.1
  gyro_sigma       : 0.0316227766
  num_imus         : 5
  num_joints       : 16
  target_rate      : 200.0
  velocity_window_time: 0.1
  calibration_file : ${host_env:DATA_ROOT}/mipo_hdf5/indoor/mipo_time_offsets.json
  debias           : true
  calibrater       : {kind: imu, debias_gyro: false}   # IMU-only static frames; IMU 0 acc only, aux IMUs stay raw

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230620_risqh_robustness_test/230620-risqh-standtrot-05-06-33square3.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "230622_robustness/230622-risqh-trot-04-048-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "230622_robustness/230622-risqh-trot-06-040-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "230622_robustness/230622-risqh-trot-06-052-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "230622_robustness/230622-risqh-trot-04-052-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230625_gait/230625-risqh-standtrot-04-048-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230625_gait/230625-risqh-standtrot-08-036-33square.h5"}}}
  #- {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230625_gait/230625-risqh-trot-08-036-33square.h5"}}}  # frozen IMU data at end of seq
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230625_gait/230625-risqh-flytrot-02-032-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230625_gait/230625-risqh-flytrot-08-036-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230620_risqh_robustness_test/230620-risqh-trot-05-036-33square-kick2.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "230622_robustness/230622-risqh-trot-10-032-33square.h5"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "20230625_gait/230625-risqh-flytrot-10-032-33square.h5"}}}
