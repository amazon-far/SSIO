# BlackBird_Valid.yaml — SlidingWindow eval (step == window_size).

_outer: &outer
  _target_: Sequence.SlidingWindow.SlidingWindow
  config:
    window_size :  ${train.window}
    step_size   :  ${train.window}

_inner: &inner
  _target_: Sequence.BlackBird.BlackBird_Sequence

_inner_config: &inner_config
  data_root: ${host_env:DATA_ROOT}/BlackBird
  device: ${meta.device}
  dtype: ${meta.dtype}
  acc_sigma  : 0.01
  gyro_sigma : 0.01
  gravity: 9.81007
  debias     : true   # subtract constant acc/gyro bias over near-static runs; see Sequence/BlackBird.py. Frame alignment happens regardless of this flag.
  calibrater :        # static frames from IMU statistics, no GT speed (Doc/debias.md)
    kind     : imu

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "tiltedThrice/yawForward/maxSpeed4p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "mouse/yawForward/maxSpeed3p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "3dFigure8/yawConstant/maxSpeed3p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "3dFigure8/yawConstant/maxSpeed5p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "sid/yawForward/maxSpeed3p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "halfMoon/yawForward/maxSpeed2p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "star/yawForward/maxSpeed5p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "star/yawForward/maxSpeed3p0"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "patrick/yawForward/maxSpeed3p0"}}}
