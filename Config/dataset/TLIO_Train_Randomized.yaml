# TLIO_Train_Randomized.yaml -- one RandomWindow(TLIO_Sequence(...)) per train sequence.
# Everything except seq.config.seq_name is shared via YAML anchors.

_outer: &outer
  _target_: Sequence.RandomWindow.RandomWindow
  config:
    window_size : ${train.window}

_inner: &inner
  _target_: Sequence.TLIO.TLIO_Sequence

_inner_config: &inner_config
  data_root  : ${host_env:DATA_ROOT}/TLIO
  device     : ${meta.device}
  dtype      : ${meta.dtype}
  acc_sigma  : 0.01
  gyro_sigma : 0.01


