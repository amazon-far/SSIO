# ANYmal GrandTour SSL pool (20 GNSS + 8 indoor). GT velocity is the GT source's
# filtered twist_lin, rotated to world in the loader. GNSS missions use gt_source=cpt7_ie; indoor SSL-only missions use
# gt_source=state_estimator (leg-inertial, pool-only).
# Train / Val / Test match the pools of the Open-IO/SSIO checkpoints.
_outer: &outer
  _target_: Sequence.RandomWindow.RandomWindow
  config:
    window_size: ${train.window}
_inner: &inner
  _target_: Sequence.ANYmal.ANYmal_Sequence
_icg: &icg
  data_root: ${host_env:DATA_ROOT}/grand_tour
  device: ${meta.device}
  dtype: ${meta.dtype}
  acc_sigma: 0.1
  gyro_sigma: 0.0316227766
  num_imus: 1
  num_joints: 12
  target_rate: 200.0
  gt_source: cpt7_ie
  debias: true            # IMU-only static detector, no GT speed (Doc/debias.md)
  calibrater: {kind: imu, gyro_mean_max: 0.005}
  gravity: ${train.gravity}
  imu_gt_offsets_json: ${host_env:DATA_ROOT}/grand_tour/anymal_imu_gt_offsets_per_imu.json
_ici: &ici
  data_root: ${host_env:DATA_ROOT}/grand_tour
  device: ${meta.device}
  dtype: ${meta.dtype}
  acc_sigma: 0.1
  gyro_sigma: 0.0316227766
  num_imus: 1
  num_joints: 12
  target_rate: 200.0
  gt_source: state_estimator
  debias: true            # IMU-only static detector, no GT speed (Doc/debias.md)
  calibrater: {kind: imu, gyro_mean_max: 0.005}
  gravity: ${train.gravity}

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-02-17-10-25"}}}  # SPX-1  gnss
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-02-17-18-32"}}}  # SPX-2  gnss
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-04-12-55-59"}}}  # CYN-1  gnss
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-11-12-07-40"}}}  # PIL-1  gnss
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-14-11-17-02"}}}  # HOEB-1  gnss
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-14-15-22-43"}}}  # KAEB-2  gnss
  - {<<: *outer, seq: {<<: *inner, config: {<<: *icg, seq_name: "2024-11-14-16-04-09"}}}  # KAEB-3  gnss
