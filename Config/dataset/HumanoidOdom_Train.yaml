# HumanoidOdom_Train.yaml — RandomWindow over 31 humanoid_g1 clips,
# disjoint from HumanoidOdom_Test.
#
# The seven commented-out stems below are excluded: the HumanoidOdom_Test clip, a
# 1,497-frame clip that would repeatedly sample the same 1,024-frame window, the only
# clip from a second robot, and four clips whose bias calibration made dead reckoning
# worse in a dead-reckoning audit.
#
# Pelvis IMU, native z-up, gravity +9.81007.

_outer: &outer
  _target_: Sequence.RandomWindow.RandomWindow
  config:
    window_size : ${train.window}

_inner: &inner
  _target_: Sequence.HumanoidOdom.HumanoidOdom

_inner_config: &inner_config
  data_root  : ${host_env:DATA_ROOT}/humanoid_g1
  device     : ${meta.device}
  dtype      : ${meta.dtype}
  part       : pelvis
  debias     : true
  calibrater :          # static frames from IMU statistics, no GT speed (Doc/debias.md)
    kind     : imu
  acc_sigma  : 0.01
  gyro_sigma : 0.01
  gravity    : ${train.gravity}

sequences:
