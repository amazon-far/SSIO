# EuRoC_Test.yaml — SlidingWindow eval (step == window_size) over the 5 held-out drives,
# disjoint from EuRoC_Train_Randomized. The paper's EuRoC numbers are on this split.

_outer: &outer
  _target_: Sequence.SlidingWindow.SlidingWindow
  config:
    window_size :  ${train.window}
    step_size   :  ${train.window}

_inner: &inner
  _target_: Sequence.EuRoC.EuRoC_Sequence

_inner_config: &inner_config
  data_root  : ${host_env:DATA_ROOT}/EuRoC
  device     : ${meta.device}
  dtype      : ${meta.dtype}
  acc_sigma  : 0.01
  gyro_sigma : 0.01
  debias     : true
  calibrater :          # static frames from IMU statistics, no GT speed (Doc/debias.md)
    kind     : imu
  gravity    : 9.81007

sequences:
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "MH_02_easy"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "MH_04_difficult"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "V1_03_difficult"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "V2_02_medium"}}}
  - {<<: *outer, seq: {<<: *inner, config: {<<: *inner_config, seq_name: "V1_01_easy"}}}
