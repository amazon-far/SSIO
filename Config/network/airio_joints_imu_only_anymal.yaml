_target_: Model.airio.JointsAirIONetworkIMUOnly

# Multi-IMU + proprioceptive-joints AirIO velocity network with NO orientation
# input — ANYmal GrandTour variant: 1 base IMU (anymal_imu) + 12 leg joints.
# Identical topology to airio_joints_imu_only.yaml (the MIPO 5-IMU/16-joint
# default), only the input widths differ (IMU input dim = 6*1, joint input dim
# = 3*12).
#
# See airio_joints_imu_only.yaml for the caveat: the world lift still uses GT
# attitude.
k_list: [7, 7]
s_list: [3, 3]
p_list: [3, 3]

num_imus:   1
num_joints: 12

# Per-joint measurements the joint stem consumes; joint input dim becomes
# len(joint_channels) * num_joints. ANYmal measures joint torque, so all three are used.
joint_channels: [position, velocity, effort]

imu_encoder_channels:   [32, 64]
joint_encoder_channels: [32, 64]

fusion_dim:    64
fusion_hidden: 128

gru1_hidden: 64
gru2_hidden: 128
bidirectional: true

decoder_hidden: 128

# Which IMU stream the network reads (`Model/airio.py::select_imu`):
#   raw       -> acc / gyro                     as measured by the sensor
#   corrected -> corrected_acc / corrected_gyro  bias-calibration output
# Required: there is no constructor default, and the Delta-v reference selects its
# own stream via `train.dv_imu_input`.
imu_input: raw
